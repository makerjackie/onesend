name: onesend_macos_updater
description: Sandboxed Sparkle 2 update bridge used by OneSend on macOS.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      macos:
        pluginClass: OneSendMacosUpdaterPlugin
