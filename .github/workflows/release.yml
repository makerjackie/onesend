name: Release desktop and Android builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.5'
  ONESEND_ANDROID_CERT_SHA256: '2a6af660bfbe4c858da95969bb6087401dcbd514082e597307b62b2e3e52ce42'

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Validate release tag matches pubspec
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION_RECORD="$(awk '/^version: / {print $2; exit}' pubspec.yaml)"
          test "$GITHUB_REF_NAME" = "v${VERSION_RECORD%%+*}"
      - run: flutter analyze
      - run: flutter test

  android:
    needs: quality
    runs-on: ubuntu-latest
    env:
      ONESEND_ANDROID_KEYSTORE_PATH: /tmp/onesend-release.jks
      ONESEND_ANDROID_STORE_PASSWORD: ${{ secrets.ONESEND_ANDROID_STORE_PASSWORD }}
      ONESEND_ANDROID_KEY_ALIAS: ${{ secrets.ONESEND_ANDROID_KEY_ALIAS }}
      ONESEND_ANDROID_KEY_PASSWORD: ${{ secrets.ONESEND_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Restore Android release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ONESEND_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$ONESEND_ANDROID_KEYSTORE_PATH"
      - run: flutter build apk --release
      - name: Verify Android release signature and permissions
        run: |
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee /tmp/onesend-apksigner.txt
          grep -Fqi "$ONESEND_ANDROID_CERT_SHA256" /tmp/onesend-apksigner.txt
          "$BUILD_TOOLS/aapt2" dump permissions "$APK" | tee /tmp/onesend-permissions.txt
          test "$(grep -c "uses-permission:" /tmp/onesend-permissions.txt)" -eq 2
          grep -Fq "android.permission.CAMERA" /tmp/onesend-permissions.txt
          grep -Fq "com.makerjackie.onesend.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION" /tmp/onesend-permissions.txt
      - name: Prepare artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk onesend-android.apk
      - uses: actions/upload-artifact@v7
        with:
          name: onesend-android
          path: onesend-android.apk

  macos:
    needs: quality
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify native QR encode/decode bridge
        run: |
          flutter build macos --release --target=tool/qr_codec_self_test.dart
          build/macos/Build/Products/Release/OneSend.app/Contents/MacOS/OneSend
      - run: flutter build macos --release
      - name: Package artifact
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/OneSend.app onesend-macos-universal.zip
      - uses: actions/upload-artifact@v7
        with:
          name: onesend-macos
          path: onesend-macos-universal.zip

  windows:
    needs: quality
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Verify updater runtime is bundled
        shell: pwsh
        run: |
          $bundle = 'build\windows\x64\runner\Release'
          if (-not (Test-Path "$bundle\onesend.exe")) { throw 'onesend.exe is missing' }
          if (-not (Test-Path "$bundle\WinSparkle.dll")) { throw 'WinSparkle.dll is missing' }
      - name: Package portable artifact
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath onesend-windows.zip
      - name: Build per-user installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $versionLine = (Select-String -Path 'pubspec.yaml' -Pattern '^version:\s+').Line
          $env:ONESEND_WINDOWS_VERSION = (($versionLine -replace '^version:\s+', '') -split '\+')[0]
          if ($env:ONESEND_WINDOWS_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid pubspec version' }
          $env:ONESEND_WINDOWS_SOURCE_DIR = (Resolve-Path 'build\windows\x64\runner\Release').Path
          $env:ONESEND_WINDOWS_OUTPUT_DIR = (Resolve-Path '.').Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" 'packaging\windows\onesend.iss'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke-test clean install and in-place upgrade
        shell: pwsh
        run: |
          $installer = (Resolve-Path 'onesend-windows-setup.exe').Path
          $installDir = Join-Path $env:RUNNER_TEMP 'onesend-installer-smoke'
          $arguments = "/VERYSILENT /SP- /SUPPRESSMSGBOXES /NORESTART /DIR=`"$installDir`""
          foreach ($pass in 1..2) {
            $process = Start-Process $installer -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "Installer pass $pass failed" }
            if (-not (Test-Path "$installDir\onesend.exe")) { throw 'Installed app is missing' }
            if (-not (Test-Path "$installDir\WinSparkle.dll")) { throw 'Installed updater is missing' }
          }
          $process = Start-Process $installer -ArgumentList "$arguments /ONESENDUPDATE=1" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Updater-mode installer failed' }
          $deadline = (Get-Date).AddSeconds(10)
          do {
            $runningApp = Get-Process -Name 'onesend' -ErrorAction SilentlyContinue
            if ($runningApp) { break }
            Start-Sleep -Milliseconds 250
          } while ((Get-Date) -lt $deadline)
          if (-not $runningApp) { throw 'Updater-mode installer did not relaunch OneSend' }
          $runningApp | Stop-Process -Force
          $runningApp | Wait-Process
          $uninstaller = Join-Path $installDir 'unins000.exe'
          $process = Start-Process $uninstaller -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Uninstaller failed' }
      - uses: actions/upload-artifact@v7
        with:
          name: onesend-windows
          path: |
            onesend-windows.zip
            onesend-windows-setup.exe

  linux:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux camera dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package artifact
        run: tar -czf onesend-linux-x64.tar.gz -C build/linux/x64/release bundle
      - uses: actions/upload-artifact@v7
        with:
          name: onesend-linux
          path: onesend-linux-x64.tar.gz

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber ./*
          else
            # Keep the release private until the locally Developer ID-signed and
            # notarized macOS package replaces the CI validation artifact.
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" ./* --title "OneSend $GITHUB_REF_NAME" --generate-notes --draft
          fi
